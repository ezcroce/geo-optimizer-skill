# Distribuzione del sito e del server WebSocket sulla stessa origine.
services:
  - type: web
    name: infinite-alibi
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --prefix games/infinite-alibi
    startCommand: node games/infinite-alibi/server/server.js
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
